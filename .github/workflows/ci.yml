name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Headless GUI regression tests create a real wgpu device; the runners
      # have no GPU, so Linux needs software Vulkan (lavapipe). Windows falls
      # back to DX12 WARP out of the box.
      - name: Install software Vulkan (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --all-targets --locked

      # Informational: the tree currently has a handful of clippy lints.
      # Once they are cleaned up this can become `-- -D warnings`.
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --locked

      - name: Test
        run: cargo test --locked

  fmt:
    name: format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Non-blocking for now: the tree predates rustfmt adoption.
      - name: rustfmt (advisory)
        continue-on-error: true
        run: cargo fmt --check
