name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Headless GUI regression tests create a real wgpu device; the runners
      # have no GPU, so Linux needs software Vulkan (lavapipe). Windows falls
      # back to DX12 WARP out of the box.
      - name: Install software Vulkan (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --all-targets --locked

      # Informational: a handful of clippy lints remain; tighten to
      # `-- -D warnings` once they are cleaned up.
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --locked

      - uses: taiki-e/install-action@nextest

      - name: Test (nextest)
        run: cargo nextest run --locked

      - name: Doc tests
        run: cargo test --doc --locked

  lint:
    name: lint (workflows, typos, fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: actionlint — GitHub Actions workflow linter
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - uses: taiki-e/install-action@typos

      - name: typos — spellcheck code and docs
        run: typos

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Advisory for now: the tree predates rustfmt adoption.
      - name: rustfmt (advisory)
        continue-on-error: true
        run: cargo fmt --check

  deny:
    name: cargo-deny (advisories, licenses, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    name: coverage (advisory report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cargo llvm-cov runs the full test suite, including the headless wgpu
      # GUI tests — they need software Vulkan on the runner (see "test" job).
      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Measure coverage
        run: cargo llvm-cov --locked --summary-only | tee coverage.txt

      - name: Publish coverage to job summary
        run: |
          {
            echo '### Coverage'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: LCOV report
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
