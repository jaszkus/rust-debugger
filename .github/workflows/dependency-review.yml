name: Dependency review

on: pull_request

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency review
    # Dependency review requires GHAS on private repositories; it activates
    # automatically once the repository is public.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Flags PRs that introduce vulnerable or disallowed dependencies,
      # including Dependabot bumps.
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
