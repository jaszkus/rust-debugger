name: Bug report
description: Something crashed, rendered wrong, or analyzed a binary incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please fill in as much as you can.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, CLI commands or a MCP tool call. A sample binary helps a lot — only if you can share it.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.5.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Console output, panic messages, UI screenshots.
      render: text
    validations:
      required: false
