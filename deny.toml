# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# CI runs this on every push/PR (see .github/workflows/ci.yml, job "deny").

[advisories]
version = 2
# Vulnerabilities always fail the check; unmaintained/unsound are reported for
# the workspace itself only (transitive reporting is opt-in).
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"
ignore = []

[licenses]
# Permissive licenses used by the dependency tree (Apache-2.0 project).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
